<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ignite Trip 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#f6f5f2; --paper:#ffffff; --ink:#1f2420; --muted:#767f76;
    --line:#e2e0da; --accent:#2f6b4f; --accent-ink:#ffffff;
    --warn:#b4452f; --am:#c98a2c; --ok:#2f6b4f; --chip:#eef0ea;
    --love:#d6336c; --pass:#b9c2bc; --not-rated:#547ea8;
    --tod-morning:#e0a52e; --tod-afternoon:#2f8fd1; --tod-evening:#d1495b; --tod-night:#6a3fa0; --tod-none:#9aa39d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:40px;
  }
  header{
    position:sticky; top:0; z-index:5; background:var(--paper);
    border-bottom:1px solid var(--line); padding:14px 16px 10px;
  }
  h1{margin:0 0 2px; font-size:19px;}
  .sub{color:var(--muted); font-size:12px;}
  .sync{
    display:inline-flex; align-items:center; gap:6px; font-size:11px;
    color:var(--muted); margin-top:6px;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--warn);}
  .sync[data-state="synced"] .dot{background:var(--ok);}
  .sync[data-state="syncing"] .dot{background:var(--am);}
  .sync[data-state="offline"] .dot{background:var(--warn);}

  nav.tabs{
    display:flex; gap:0; border-bottom:1px solid var(--line); background:var(--paper);
    position:sticky; top:58px; z-index:4;
  }
  nav.tabs button{
    flex:1; border:none; background:none; padding:10px 4px; font-size:12.5px;
    font-weight:600; color:var(--muted); border-bottom:2px solid transparent;
    cursor:pointer;
  }
  nav.tabs button.on{color:var(--accent); border-bottom-color:var(--accent);}

  main{max-width:640px; margin:0 auto; padding:14px 12px;}
  .view{display:none;}
  .view.on{display:block;}

  .cat{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    margin-bottom:14px; overflow:hidden;
  }
  .cat h2{
    margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase;
    letter-spacing:.04em; color:var(--muted); background:var(--chip);
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;
  }
  .cat-left{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
  .cat-right{display:flex; align-items:center; gap:2px; flex:none;}
  .cat h2 .cat-title{flex:1; outline:none; min-width:0;}
  .cat h2 .del{color:var(--muted);}
  .node-children{
    margin-left:16px; padding-left:10px; border-left:1px solid var(--line);
  }
  .toggle{
    flex:none; width:18px; height:18px; border:none; background:none; padding:0;
    color:var(--muted); font-size:11px; cursor:pointer; line-height:18px; text-align:center;
  }
  .toggle-spacer{flex:none; width:18px; display:inline-block;}
  .plus{
    flex:none; border:none; background:none; color:var(--accent); font-size:19px;
    font-weight:700; cursor:pointer; padding:0 6px; line-height:1;
  }
  .kid-count{
    display:inline-block; font-size:10.5px; color:var(--muted); background:var(--bg);
    border-radius:20px; padding:1px 7px; font-weight:600; flex:none;
  }
  .item.has-kids-1{background:#e3f2e8;}
  .item.has-kids-2{background:#eef8f1;}
  .item.has-kids-3{background:#f6fbf8;}
  .checklist-toolbar{display:flex; gap:8px; margin-bottom:10px;}
  .toolbar-btn{
    flex:none; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer;
  }
  .item{
    display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .item:last-of-type{border-bottom:none;}
  .item input[type=checkbox]{
    width:20px; height:20px; margin-top:2px; flex:none; accent-color:var(--accent);
  }
  .item-body{flex:1; min-width:0;}
  .item-text{
    font-size:14.5px; outline:none; word-break:break-word;
  }
  .item.done .item-text{color:var(--muted); text-decoration:line-through;}
  .meta-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px;}
  .chip{
    font-size:11px; background:var(--chip); color:var(--muted); border-radius:20px;
    padding:2px 8px; outline:none;
  }
  .chip.due{cursor:default;}
  .chip.overdue{background:#fbe3dd; color:var(--warn);}
  .chip.soon{background:#faecd2; color:var(--am);}
  .del{
    flex:none; border:none; background:none; color:var(--muted); font-size:16px;
    cursor:pointer; padding:2px 4px; line-height:1;
  }
  .add-row{
    display:flex; gap:8px; padding:10px 14px; background:var(--bg);
  }
  .add-row input{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-size:14px; min-width:0;
  }
  .add-row select{
    flex:none; border:1px solid var(--line); border-radius:8px; padding:8px 4px;
    font-size:13px; background:var(--paper); color:var(--ink);
  }
  .add-row button{
    flex:none; border:none; background:var(--accent); color:var(--accent-ink);
    border-radius:8px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer;
  }

  .day{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    margin-bottom:14px; overflow:hidden;
  }
  .day h2{
    margin:0; padding:10px 14px; font-size:14px; background:var(--chip);
    border-bottom:1px solid var(--line); display:flex; justify-content:space-between;
  }
  .day h2 .tag{font-size:11px; color:var(--muted); font-weight:400;}
  .entry{
    padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px;
  }
  .entry:last-of-type{border-bottom:none;}
  .entry-time{
    flex:none; width:68px; font-size:12px; color:var(--muted); outline:none; padding-top:2px;
  }
  .entry-time-pick{
    flex:none; width:98px; display:flex; flex-wrap:wrap; gap:2px;
  }
  .entry-time-pick select{
    font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:6px;
    padding:1px 2px; background:var(--paper);
  }
  .entry-body{flex:1; min-width:0;}
  .entry-title{font-size:14.5px; font-weight:600; outline:none; word-break:break-word;}
  .entry-notes{font-size:13px; color:var(--muted); outline:none; margin-top:3px; word-break:break-word;}
  .owner{
    display:inline-block; font-size:10.5px; font-weight:700; padding:1px 7px;
    border-radius:20px; background:var(--chip); color:var(--accent); margin-top:4px;
  }
  select.owner-select{
    font-size:10.5px; border:1px solid var(--line); border-radius:20px; padding:1px 6px;
    margin-top:4px; color:var(--accent); background:var(--chip);
  }
  .empty-day{padding:14px; color:var(--muted); font-size:13px; font-style:italic;}

  .edit-icon{color:var(--muted); font-size:11px;}
  [contenteditable="true"]:focus{background:#fffce0; border-radius:4px;}

  .update-banner{
    position:fixed; left:12px; right:12px; bottom:12px; z-index:50;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
    padding:12px 16px; font-size:14px; font-weight:600; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.2); cursor:pointer;
  }

  .stale-block{
    position:fixed; inset:0; z-index:100; background:rgba(31,36,32,.55);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .stale-block-card{
    background:var(--paper); border-radius:12px; padding:22px 20px; max-width:360px;
    text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3); font-size:14.5px; line-height:1.5;
  }
  .stale-block-card button{
    margin-top:14px; border:none; background:var(--accent); color:var(--accent-ink);
    border-radius:8px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer;
  }

  .cal-grid{
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px;
  }
  .cal-dow{
    text-align:center; font-size:11px; color:var(--muted); font-weight:600; padding:2px 0 6px;
  }
  .cal-cell{
    aspect-ratio:1; border:1px solid var(--line); border-radius:8px; background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font:inherit; font-size:13px; color:var(--ink); cursor:pointer; padding:2px; margin:0;
  }
  .cal-cell.empty{border:none; background:none; cursor:default;}
  .cal-cell.today{border-color:var(--accent); font-weight:700;}
  .cal-cell.selected{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .cal-cell.selected .cal-dot{background:var(--accent-ink);}
  .cal-dot{width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:3px;}
  .cal-dot.overdue{background:var(--warn);}
  .cal-agenda{
    background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .cal-agenda h3{
    margin:0; padding:10px 14px; font-size:14px; background:var(--chip);
    border-bottom:1px solid var(--line);
  }
  .cal-item{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--line); font-size:14px;
  }
  .cal-item:last-child{border-bottom:none;}
  .cal-item.done span:not(.owner){color:var(--muted); text-decoration:line-through;}
  .cal-item .owner{
    margin-left:auto; flex:none; font-size:10.5px; color:var(--accent); background:var(--chip);
    border-radius:20px; padding:1px 7px;
  }
  .cal-entry-time{font-size:12px; color:var(--muted); flex:none; width:68px;}

  .undated-section{
    margin-top:16px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .undated-section > h3{
    margin:0 0 8px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); font-weight:700;
  }
  .undated-node{margin-bottom:1px;}
  .undated-children{margin-left:13px; padding-left:8px; border-left:1px solid var(--line);}
  .undated-label{font-size:12px; font-weight:600; color:var(--muted); padding:3px 6px; border-radius:5px;}
  .undated-label.undated-cat{text-transform:uppercase; letter-spacing:.03em; font-size:11px; padding:3px 0;}
  .undated-item{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink);
    padding:3px 6px; border-radius:5px;
  }
  .undated-item input[type=checkbox]{width:14px; height:14px; flex:none; accent-color:var(--accent);}
  .undated-item.done span{color:var(--muted); text-decoration:line-through;}
  .undated-item.has-kids-1, .undated-label.has-kids-1{background:#e3f2e8;}
  .undated-item.has-kids-2, .undated-label.has-kids-2{background:#eef8f1;}
  .undated-item.has-kids-3, .undated-label.has-kids-3{background:#f6fbf8;}

  .notes-card{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    margin-bottom:14px; overflow:hidden;
  }
  .note-row{
    display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .note-row:last-child{border-bottom:none;}
  .note-text{flex:1; font-size:14.5px; word-break:break-word; white-space:pre-wrap;}
  .note-text a{color:var(--accent); word-break:break-all;}
  .note-edit-input{
    flex:1; border:1px solid var(--line); border-radius:8px; padding:6px 8px;
    font-size:14.5px; min-width:0;
  }

  .places-head{
    margin:0; padding:10px 14px; font-size:13px; text-transform:uppercase;
    letter-spacing:.04em; color:var(--muted); background:var(--chip);
    border-bottom:1px solid var(--line);
  }
  .places-map{height:200px; border-bottom:1px solid var(--line);}
  .place-row{
    display:flex; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line);
    align-items:flex-start;
  }
  .place-row:last-child{border-bottom:none;}
  .place-body{flex:1; min-width:0;}
  .place-details{margin-top:8px;overflow-wrap:anywhere;}
  .place-details button,.place-details-editor button{margin-top:6px;}
  .place-details-editor label{display:block;margin-top:8px;}
  .place-details-editor input,.place-details-editor textarea{box-sizing:border-box;width:100%;padding:8px;}
  .place-reference-edit{display:grid;gap:5px;margin:10px 0;padding:8px;border:1px solid #bbb;border-radius:8px;}
  .place-reference-edit button{justify-self:start;}
  .place-notes-text{white-space:pre-wrap;padding:6px 0;}
  .place-details-error{color:#b00020;margin:6px 0;}
  .place-label{font-size:14.5px; font-weight:600; word-break:break-word;}
  .place-nopin{font-size:11px; color:var(--muted); font-weight:400;}
  .place-link{display:inline-block; margin-top:3px; font-size:12.5px; color:var(--accent);}

  .day-bar{display:flex; gap:6px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--bg);}
  .day-pill{
    flex:none; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer;
  }
  .day-pill.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .seg-toggle{display:flex; border-bottom:1px solid var(--line);}
  .seg-btn{
    flex:1; border:none; background:var(--paper); color:var(--muted);
    padding:9px 6px; font-size:12.5px; font-weight:600; cursor:pointer;
    border-bottom:2px solid transparent;
  }
  .seg-btn.on{color:var(--accent); background:var(--chip); border-bottom-color:var(--accent);}

  .ptype-bar{
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    border-bottom:1px solid var(--line); background:var(--bg);
  }
  .ptype-label{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .ptype-bar select{
    border:1px solid var(--line); border-radius:8px; padding:6px 10px;
    font-size:13px; background:var(--paper); color:var(--ink);
  }

  .tier-section{border-bottom:1px solid var(--line);}
  .tier-section:last-child{border-bottom:none;}
  .tier-section.drop-target{background:var(--chip); outline:2px dashed var(--accent); outline-offset:-2px;}
  .tier-head{
    padding:8px 14px; font-size:12px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.03em; background:var(--bg);
    display:flex; align-items:center; gap:8px;
  }
  .drag-handle{
    flex:none; cursor:grab; color:var(--muted); font-size:16px; padding:4px 6px;
    touch-action:none; user-select:none;
  }
  .place-row.dragging{opacity:.6; position:relative; z-index:5;}
  .place-time-pick{display:inline-flex; gap:2px;}
  .place-time-pick select{
    font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:6px;
    padding:1px 2px; background:var(--paper);
  }
  .place-pin{
    width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.9);
  }
  .place-pin-glyph{transform:rotate(45deg); font-size:13px; line-height:1;}
  #view-reservations .section{max-width:820px;margin:16px auto;padding:16px;}
  .reservation-storage{padding:12px;background:#fff3d6;border-radius:8px;font-size:13px;}
  #reservationMessage{color:var(--warn);white-space:pre-wrap;position:sticky;top:110px;background:var(--paper);z-index:2;}
  .reservation-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0;overflow-wrap:anywhere;}
  .reservation-card h3{margin:0 0 5px;}
  .reservation-times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0;}
  .reservation-time{padding:10px;border-left:5px solid;border-radius:5px;background:var(--bg);}
  .reservation-muted{color:var(--muted);font-size:13px;}
  .reservation-next-day{background:#eee6f8;color:#4e2677;padding:8px;border-radius:6px;font-weight:600;}
  .reservation-traveller,.reservation-extra{padding:9px 0;border-bottom:1px solid var(--line);}
  .reservation-code{margin:6px 0;}
  .reservation-code button{font-size:12px;}
  .reservation-notes{white-space:pre-wrap;margin:10px 0;}
  .reservation-form{border:1px solid var(--line);padding:12px;border-radius:10px;background:var(--paper);}
  .reservation-form label{display:block;margin:10px 0;}
  .reservation-form input,.reservation-form select,.reservation-form textarea,#reservationImportText{display:block;box-sizing:border-box;width:100%;padding:9px;font:inherit;}
  .reservation-form fieldset{border:1px solid var(--line);border-radius:8px;margin:12px 0;}
  @media(max-width:480px){.reservation-times{grid-template-columns:1fr;}#view-reservations .section{padding:10px;}}
</style>
</head>
<body>

<header>
  <h1>Ignite Trip 2026</h1>
  <div class="sub">San Francisco · Mon Nov 16 – Sun Nov 22</div>
  <div class="sync" id="syncBadge" data-state="offline">
    <span class="dot"></span><span id="syncLabel">offline</span>
    <span style="color:var(--muted);">· build 2026-11-12-5</span>
  </div>
</header>

<nav class="tabs">
  <button id="tab-checklist" class="on" onclick="setTab('checklist')">Prep Checklist</button>
  <button id="tab-days" onclick="setTab('days')">Trip Days</button>
  <button id="tab-cal" onclick="setTab('cal')">Calendar</button>
  <button id="tab-notes" onclick="setTab('notes')">Notes</button>
  <button id="tab-places" onclick="setTab('places')">Places</button>
  <button id="tab-reservations" onclick="setTab('reservations')">Flights &amp; Stays</button>
</nav>

<main>
  <div id="view-checklist" class="view on"></div>
  <div id="view-days" class="view"></div>
  <div id="view-cal" class="view"></div>
  <div id="view-notes" class="view"></div>
  <div id="view-places" class="view"></div>
  <div id="view-reservations" class="view"></div>
</main>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<!-- Leaflet (free, no API key — OpenStreetMap tiles) for the Places mini-map -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ============================================================================
// DATA MODEL
// STATE = { checklist: [ {id,parentId,text,owner,priority,due,done} ],
//           days:      [ {date,label,entries:[{id,time,title,owner,notes}]} ],
//           notes:     [ {id,parentId,text} ],
//           places:    [ {id,label,mapsUrl,lat,lng,date,category,tier,time,ptype} ] }
// A place's `date` matches one of days[].date (grouping it under that trip
// day, on its own page), or "" for a place not tied to any specific day.
// `category` is "personal" or "conference" (a second top-level filter,
// orthogonal to day, so this same app can double as a conference-session
// planner). `tier` is "love" or "pass" (set via a dropdown or by dragging
// the card between the two tier sections) and drives the map pin/card
// color when the color-mode toggle is set to "by preference". `time` is an
// optional "H:MM AM/PM" string (same format/picker as Trip Days entries);
// it buckets into a time-of-day (morning/afternoon/evening/night) that
// drives the pin color when the toggle is set to "by time of day" instead,
// with the icon showing the other signal (time as an emoji glyph when
// color is spent on tier; nothing extra when color is already time).
// `ptype` is "restaurant"/"site"/"touristTrap"/"logistics"/
// "conferenceSession"/"vineyard" (or "" if
// untagged) — a second, independent filter alongside category/day, so
// "show me just the restaurants on the 17th" narrows the same view.
//
// checklist is a tree flattened into one array: a node's parentId points at
// its parent's id. Top-level sections (what used to be the fixed "category"
// field) are nodes whose parentId is ROOT — a string sentinel, not null,
// because Firebase Realtime Database silently drops any key written as null,
// which would make a top-level node indistinguishable from an orphan on the
// next read. Any node can have children, to any depth — that's what lets
// "Clean house" hold "Kitchen" hold "Wipe counters".
// ============================================================================

var ROOT = "root";
var LEGACY_CATEGORIES = ["Pack","Clean house","Groceries","Bus / school coordination"];

// Bump this whenever the STATE shape changes in a way older code can't
// safely read (the flat-category -> parentId-tree change for checklist
// items was version 2; turning notes from a flat list into the same
// parentId-tree shape is version 3; adding the places list is version 4;
// giving each place a `date` so Places can group by trip day is version 5;
// adding `category`/`tier`/`time` to each place is version 6; adding
// `ptype` is version 7 — each of those version bumps exists because an
// older build's migratePlaces doesn't know the new field and would
// silently drop it on its next write. Version 8 adds address, notes and
// references (label/url/creator) to Places. Version 9 adds the explicit
// notRated tier; older clients cannot display that tier and must reload.
// Version 10 expands the place-type vocabulary. Type keys are preserved
// during migration; saved cards are reclassified explicitly, not guessed.
// Version 11 adds STATE.reservations to the shared payload, with migration
// of old states to an empty list. Older clients must reload before writing.
// The Firebase sync module compares this against whatever version is
// already saved: if Firebase has a newer version than this build
// understands, this client is stale and gets blocked from writing (and
// editing) instead of silently overwriting newer data with older data.
var SCHEMA_VERSION = 11;

var OWNERS_DAY = ["Chris","Inez","Both"];

var MINUTES = ["00","05","10","15","20","25","30","35","40","45","50","55"];
var AMPM = ["AM","PM"];

// One-time upgrade from the old flat {category: "Pack"} shape to the
// parentId tree: turns each distinct category string into a real top-level
// node and repoints its items at that node's id. Safe to call on
// already-migrated data (it's a no-op once nothing has a bare `category`).
function migrateChecklist(list){
  if(!list || !list.length) return list || [];
  var isLegacy = list.some(function(i){ return i && i.category !== undefined && i.parentId === undefined; });
  if(!isLegacy) return list;
  var seen = {}, order = [], catIds = {}, catNodes = [];
  LEGACY_CATEGORIES.forEach(function(c){ seen[c]=true; order.push(c); });
  list.forEach(function(i){ if(i.category && !seen[i.category]){ seen[i.category]=true; order.push(i.category); } });
  order.forEach(function(name){
    var id = uid("ck");
    catIds[name] = id;
    catNodes.push({id:id, parentId:ROOT, text:name});
  });
  var items = list.map(function(i){
    return {id:i.id, parentId: catIds[i.category] || ROOT, text:i.text, owner:i.owner, priority:i.priority, due:i.due, done:i.done};
  });
  return catNodes.concat(items);
}

// One-time upgrade from the original flat notes shape ({id,text}, no
// hierarchy) to the parentId tree: every existing note just becomes a
// top-level note (parentId ROOT) — there was nothing to nest it under
// before, so that's the only sensible placement. Safe to call on
// already-migrated data.
function migrateNotes(list){
  if(!list || !list.length) return list || [];
  var isLegacy = list.some(function(n){ return n && n.parentId === undefined; });
  if(!isLegacy) return list;
  return list.map(function(n){ return {id:n.id, parentId:ROOT, text:n.text}; });
}

// Places has no legacy shape to migrate from (it's new as of version 4) —
// this just defends against a missing/malformed entry so one bad record
// (e.g. a lat that got written as a string) can't break the map or the
// list, gives every place a `date` (version 5) so a place saved before
// per-day grouping existed just lands in the "No day" bucket instead of
// vanishing, gives every place `category`/`tier`/`time` (version 6) — an
// older place defaults to Personal/Or-not/no-time rather than being
// dropped by a filter it predates — and gives every place `ptype`
// (version 7), defaulting to untagged rather than hidden by the new
// restaurant/site/tourist-trap/logistics filter.
function safeReferenceUrl(value){
  try {
    var u = new URL(String(value || "").trim());
    return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "";
  } catch(e){ return ""; }
}
function normalizePlaceReferences(value){
  // RTDB may turn an array into an object keyed by numeric strings.
  var list = Array.isArray(value) ? value :
    (value && typeof value === "object" ? Object.keys(value)
      .filter(function(k){ return /^\d+$/.test(k); })
      .sort(function(a,b){ return +a-+b; }).map(function(k){ return value[k]; }) : []);
  return list.filter(function(r){ return r && safeReferenceUrl(r.url); }).map(function(r){
    return {label:String(r.label || "Reference"), url:safeReferenceUrl(r.url), creator:String(r.creator || "")};
  });
}
function migratePlaces(list){
  if(!list) return [];
  return list.map(function(p){
    return {
      id: p.id || uid("pl"),
      label: p.label || "Place",
      mapsUrl: p.mapsUrl || "",
      lat: (typeof p.lat === "number" && !isNaN(p.lat)) ? p.lat : null,
      lng: (typeof p.lng === "number" && !isNaN(p.lng)) ? p.lng : null,
      date: p.date || "",
      category: p.category || "personal",
      tier: p.tier || "pass",
      time: p.time || "",
      // Preserve existing and newly supported type keys across upgrades.
      ptype: typeof p.ptype === "string" ? p.ptype : "",
      address: String(p.address || ""),
      notes: String(p.notes || ""),
      references: normalizePlaceReferences(p.references)
    };
  });
}

var STATE = null;
var LS_KEY = "ignite-trip-2026-v1";

function loadLocal(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && parsed.checklist) parsed.checklist = migrateChecklist(parsed.checklist);
      if(parsed && parsed.notes) parsed.notes = migrateNotes(parsed.notes);
      if(parsed && parsed.places) parsed.places = migratePlaces(parsed.places);
      if(parsed) parsed.reservations = migrateReservations(parsed.reservations);
      return parsed;
    }
  }catch(e){}
  return null;
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
}

STATE = loadLocal() || defaultState();
STATE.notes = STATE.notes || []; // older saved data predates the Notes tab
STATE.places = STATE.places || []; // older saved data predates the Places section
STATE.reservations = STATE.reservations || []; // schema 11

// RENDER

function todayStr(){ return new Date().toISOString().slice(0,10); }

function dueChipClass(due, done){
  if(done || !due) return "";
  var today = todayStr();
  if(due < today) return "overdue";
  var d = new Date(due+"T00:00:00"), t = new Date(today+"T00:00:00");
  var days = Math.round((d-t)/86400000);
  if(days <= 7) return "soon";
  return "";
}

function childrenOf(parentId){
  return STATE.checklist.filter(function(i){ return i.parentId===parentId; });
}

// Collapse/expand and "show the add-sub-item input" are both per-node
// *display* state, not data — kept in memory only (never saved/synced), so
// toggling one never triggers a Firebase write or shows up on another
// device.
var _collapsed = {};
var _addOpen = {};

function toggleCollapse(id){
  _collapsed[id] = !_collapsed[id];
  render();
}
function toggleAddOpen(id){
  _addOpen[id] = !_addOpen[id];
  if(_addOpen[id]) _collapsed[id] = false;
  render();
  if(_addOpen[id]){
    var el = document.getElementById('new-child-'+id);
    if(el) el.focus();
  }
}
function collapseAll(){
  STATE.checklist.forEach(function(n){ if(childrenOf(n.id).length) _collapsed[n.id] = true; });
  render();
}
function expandAll(){
  _collapsed = {};
  render();
}

// Builds the "add sub-item…" row shared by every node and by each top-level
// section, shown only once its "+" has been tapped (see _addOpen above) —
// otherwise every single item would carry its own permanently-visible blank
// input, which is the clutter this was built to fix.
function addRowHtml(parentId, placeholder){
  return '<div class="add-row">' +
    '<input type="text" placeholder="'+esc(placeholder)+'" id="new-child-'+parentId+'" onkeydown="if(event.key===\'Enter\')addChild(\''+parentId+'\')">' +
    '<button onclick="addChild(\''+parentId+'\')">Add</button>' +
  '</div>';
}

// Renders one checklist node (any depth below the top level) plus its own
// children, recursively — this is what lets "Passport" sit under "Gather
// documents" and still have its own sub-steps underneath it. Its children
// (and their own "add sub-item" row) collapse behind a chevron when there's
// too much to scan at once.
function renderChecklistNode(node, depth){
  depth = depth || 1;
  var cls = dueChipClass(node.due, node.done);
  var kids = childrenOf(node.id);
  var hasKids = kids.length>0;
  var isCollapsed = !!_collapsed[node.id];
  var addOpen = !!_addOpen[node.id];
  var toggleBtn = hasKids
    ? '<button class="toggle" onclick="toggleCollapse(\''+node.id+'\')" title="'+(isCollapsed?'Expand':'Collapse')+'">'+(isCollapsed?'▸':'▾')+'</button>'
    : '<span class="toggle-spacer"></span>';
  var childrenHtml = isCollapsed ? '' :
    '<div class="node-children">' +
      kids.map(function(k){ return renderChecklistNode(k, depth+1); }).join('') +
      (addOpen ? addRowHtml(node.id, 'Add sub-item…') : '') +
    '</div>';
  return '' +
    '<div class="node" data-id="'+node.id+'">' +
      '<div class="item'+(node.done?' done':'')+(hasKids?' '+groupShadeClass(depth):'')+'">' +
        toggleBtn +
        '<input type="checkbox" '+(node.done?'checked':'')+' onchange="toggleDone(\''+node.id+'\')">' +
        '<div class="item-body">' +
          '<div class="item-text" contenteditable="true" onblur="editChecklistField(\''+node.id+'\',\'text\',this.textContent)">'+esc(node.text)+'</div>' +
          (isCollapsed && hasKids ? '<span class="kid-count">'+kids.length+' sub-item'+(kids.length===1?'':'s')+'</span>' : '') +
          '<div class="meta-row">' +
            '<select class="chip" onchange="editChecklistField(\''+node.id+'\',\'owner\',this.value)">' +
              OWNERS_CHECKLIST.map(function(o){return '<option value="'+o+'"'+(o===node.owner?' selected':'')+'>'+o+'</option>';}).join('') +
            '</select>' +
            '<select class="chip" onchange="editChecklistField(\''+node.id+'\',\'priority\',this.value)">' +
              ["Low","Medium","High"].map(function(p){return '<option value="'+p+'"'+(p===node.priority?' selected':'')+'>'+p+'</option>';}).join('') +
            '</select>' +
            '<input class="chip due '+cls+'" type="date" value="'+(node.due||'')+'" onchange="editChecklistField(\''+node.id+'\',\'due\',this.value)">' +
          '</div>' +
        '</div>' +
        '<button class="plus" onclick="toggleAddOpen(\''+node.id+'\')" title="Add sub-item">+</button>' +
        '<button class="del" onclick="deleteNode(\''+node.id+'\')" title="Delete">✕</button>' +
      '</div>' +
      childrenHtml +
    '</div>';
}

function renderChecklist(){
  var cats = childrenOf(ROOT);
  var html = '<div class="checklist-toolbar">' +
    '<button class="toolbar-btn" onclick="expandAll()">Expand all</button>' +
    '<button class="toolbar-btn" onclick="collapseAll()">Collapse all</button>' +
  '</div>';
  html += cats.map(function(cat){
    var kids = childrenOf(cat.id);
    var hasKids = kids.length>0;
    var isCollapsed = !!_collapsed[cat.id];
    var addOpen = !!_addOpen[cat.id];
    var toggleBtn = hasKids
      ? '<button class="toggle" onclick="toggleCollapse(\''+cat.id+'\')" title="'+(isCollapsed?'Expand':'Collapse')+'">'+(isCollapsed?'▸':'▾')+'</button>'
      : '<span class="toggle-spacer"></span>';
    var bodyHtml = isCollapsed ? '' :
      kids.map(function(k){ return renderChecklistNode(k, 1); }).join('') +
      (addOpen ? addRowHtml(cat.id, 'Add item…') : '');
    return '' +
      '<div class="cat" data-id="'+cat.id+'">' +
        '<h2>' +
          '<span class="cat-left">' +
            toggleBtn +
            '<span class="cat-title" contenteditable="true" onblur="editChecklistField(\''+cat.id+'\',\'text\',this.textContent)">'+esc(cat.text)+'</span>' +
            (isCollapsed && hasKids ? '<span class="kid-count">'+kids.length+'</span>' : '') +
          '</span>' +
          '<span class="cat-right">' +
            '<button class="plus" onclick="toggleAddOpen(\''+cat.id+'\')" title="Add item">+</button>' +
            '<button class="del" onclick="deleteNode(\''+cat.id+'\')" title="Delete section">✕</button>' +
          '</span>' +
        '</h2>' +
        bodyHtml +
      '</div>';
  }).join('');
  html += '' +
    '<div class="add-row" style="background:var(--paper); border:1px dashed var(--line); border-radius:10px;">' +
      '<input type="text" placeholder="Add a new section (e.g. Gather documents)…" id="new-category" onkeydown="if(event.key===\'Enter\')addCategory()">' +
      '<button onclick="addCategory()">Add section</button>' +
    '</div>';
  document.getElementById('view-checklist').innerHTML = html;
}

function renderDays(){
  var html = STATE.days.map(function(d){
    var entries = d.entries.slice().sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });
    var rows = entries.length ? entries.map(function(e){
      return '' +
        '<div class="entry" data-id="'+e.id+'">' +
          entryTimeHtml(d.date, e) +
          '<div class="entry-body">' +
            '<div class="entry-title" contenteditable="true" onblur="editEntryField(\''+d.date+'\',\''+e.id+'\',\'title\',this.textContent)">'+esc(e.title)+'</div>' +
            '<div class="entry-notes" contenteditable="true" onblur="editEntryField(\''+d.date+'\',\''+e.id+'\',\'notes\',this.textContent)">'+esc(e.notes||'')+'</div>' +
            '<select class="owner-select" onchange="editEntryField(\''+d.date+'\',\''+e.id+'\',\'owner\',this.value)">' +
              OWNERS_DAY.map(function(o){return '<option value="'+o+'"'+(o===e.owner?' selected':'')+'>'+o+'</option>';}).join('') +
            '</select>' +
          '</div>' +

    }).join('') : '<div class="empty-day">Nothing planned yet.</div>';
    return '' +
      '<div class="day">' +
        '<h2>'+esc(d.label)+'</h2>' +
        rows +
        '<div class="add-row">' +
          '<select id="newtime-h-'+d.date+'">' + HOURS.map(function(h){return '<option value="'+h+'">'+h+'</option>';}).join('') + '</select>' +
          '<select id="newtime-m-'+d.date+'">' + MINUTES.map(function(m){return '<option value="'+m+'">'+m+'</option>';}).join('') + '</select>' +
          '<select id="newtime-ap-'+d.date+'">' + AMPM.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('') + '</select>' +
          '<input type="text" placeholder="Suggestion…" id="newtitle-'+d.date+'" onkeydown="if(event.key===\'Enter\')addEntry(\''+d.date+'\')">' +
          '<button onclick="addEntry(\''+d.date+'\')">Add</button>' +
        '</div>' +
      '</div>';
  }).join('');
  document.getElementById('view-days').innerHTML = html;
}

function parseSimpleTime(str){
  if(!str) return {h:"--", m:"00", ap:"AM"};
  var match = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(String(str).trim());
  if(!match) return null;
  var h = match[1], m = match[2], ap = match[3].toUpperCase();
  if(HOURS.indexOf(h)===-1 || MINUTES.indexOf(m)===-1) return null;
  return {h:h, m:m, ap:ap};
}

function entryTimeHtml(date, e){
  var pt = parseSimpleTime(e.time);
  if(!pt){
    return '<div class="entry-time" contenteditable="true" onblur="editEntryField(\''+date+'\',\''+e.id+'\',\'time\',this.textContent)">'+esc(e.time||'')+'</div>';
  }
  return '<div class="entry-time-pick">' +
    '<select onchange="editEntryTime(\''+date+'\',\''+e.id+'\',\'h\',this.value)">' + HOURS.map(function(h){return '<option value="'+h+'"'+(h===pt.h?' selected':'')+'>'+h+'</option>';}).join('') + '</select>' +
    '<select onchange="editEntryTime(\''+date+'\',\''+e.id+'\',\'m\',this.value)">' + MINUTES.map(function(m){return '<option value="'+m+'"'+(m===pt.m?' selected':'')+'>'+m+'</option>';}).join('') + '</select>' +
    '<select onchange="editEntryTime(\''+date+'\',\''+e.id+'\',\'ap\',this.value)">' + AMPM.map(function(p){return '<option value="'+p+'"'+(p===pt.ap?' selected':'')+'>'+p+'</option>';}).join('') + '</select>' +
    '</div>';
}

// ============================================================================
// CALENDAR
// A month grid for November 2026 (the only month this trip's dates fall
// in — no prev/next nav, this app isn't a general-purpose calendar) plus an
// agenda panel for whichever day is selected. Pulls from both data sources
// that already carry real dates: checklist items with a due date, and Trip
// Days entries — so prep deadlines and the trip itself show on one
// timeline. Tapping a cell just selects it for the agenda below; editing
// still happens back on the Prep Checklist / Trip Days tabs.
// ============================================================================
var CAL_YEAR = 2026, CAL_MONTH = 10; // November, 0-indexed
var _selectedCalDate = null;
var WEEKDAY_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function checklistItemsByDate(){
  var map = {};
  STATE.checklist.forEach(function(n){
    if(!n.due) return;
    (map[n.due] = map[n.due] || []).push(n);
  });
  return map;
}
function dayEntriesByDate(){
  var map = {};
  STATE.days.forEach(function(d){
    if(d.entries && d.entries.length) map[d.date] = d.entries;
  });
  return map;
}
function formatCalDateLabel(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
}
function selectCalDate(dateStr){
  _selectedCalDate = dateStr;
  renderCalendar();
}

function renderCalendar(){
  var today = todayStr();
  var monthStart = CAL_YEAR+'-11-01', monthEnd = CAL_YEAR+'-11-30';
  if(!_selectedCalDate){
    _selectedCalDate = (today>=monthStart && today<=monthEnd) ? today : monthStart;
  }
  var ckByDate = checklistItemsByDate();
  var dayByDate = dayEntriesByDate();
  var daysInMonth = new Date(CAL_YEAR, CAL_MONTH+1, 0).getDate();
  var startWeekday = new Date(CAL_YEAR, CAL_MONTH, 1).getDay();

  var cells = WEEKDAY_LABELS.map(function(w){ return '<div class="cal-dow">'+w+'</div>'; });
  for(var i=0;i<startWeekday;i++) cells.push('<div class="cal-cell empty"></div>');
  for(var day=1; day<=daysInMonth; day++){
    var dateStr = CAL_YEAR+'-11-'+(day<10?'0':'')+day;
    var total = (ckByDate[dateStr]||[]).length + (dayByDate[dateStr]||[]).length;
    var hasOverdue = (ckByDate[dateStr]||[]).some(function(n){ return !n.done && dateStr<today; });
    var cls = 'cal-cell' + (dateStr===today?' today':'') + (dateStr===_selectedCalDate?' selected':'');
    cells.push(
      '<button class="'+cls+'" onclick="selectCalDate(\''+dateStr+'\')">' +
        '<span>'+day+'</span>' +
        (total>0 ? '<span class="cal-dot'+(hasOverdue?' overdue':'')+'"></span>' : '') +
      '</button>'
    );
  }
  var gridHtml = '<div class="cal-grid">' + cells.join('') + '</div>';

  var selCk = ckByDate[_selectedCalDate] || [];
  var selDay = dayByDate[_selectedCalDate] || [];
  var agendaRows = selCk.map(function(n){
    return '<div class="cal-item'+(n.done?' done':'')+'">' +
      '<input type="checkbox" '+(n.done?'checked':'')+' onchange="toggleDone(\''+n.id+'\')">' +
      '<span>'+esc(n.text)+'</span>' +
      (n.owner ? '<span class="owner">'+esc(n.owner)+'</span>' : '') +
    '</div>';
  }).join('') + selDay.map(function(e){
    return '<div class="cal-item">' +
      '<span class="cal-entry-time">'+esc(e.time||'')+'</span>' +
      '<span>'+esc(e.title)+'</span>' +
    '</div>';
  }).join('');
  if(!agendaRows) agendaRows = '<div class="empty-day">Nothing due or planned this day.</div>';
  var agendaHtml = '<div class="cal-agenda"><h3>'+formatCalDateLabel(_selectedCalDate)+'</h3>' + agendaRows + '</div>';

  document.getElementById('view-cal').innerHTML = gridHtml + agendaHtml + renderUndatedSection();
}

// ----------------------------------------------------------------------------
// No-date section: everything that can't show on the grid above because it
// has no due date, still grouped the same way the Prep Checklist groups it
// (category -> item -> sub-item), just compact. A node with a date but an
// undated descendant still appears, as a plain (non-checkable) label, purely
// so the undated item underneath it has somewhere to hang — it's already on
// the grid in its own right.
// ----------------------------------------------------------------------------
function nodeIsTask(node){ return node.parentId !== ROOT; }

function subtreeHasUndated(node){
  if(nodeIsTask(node) && !node.due) return true;
  return childrenOf(node.id).some(subtreeHasUndated);
}

function renderUndatedNode(node, depth){
  depth = depth || 1;
  var kids = childrenOf(node.id).filter(subtreeHasUndated);
  var hasKids = kids.length>0;
  var shadeCls = hasKids ? ' '+groupShadeClass(depth) : '';
  var selfHtml;
  if(nodeIsTask(node)){
    selfHtml = !node.due
      ? '<div class="undated-item'+(node.done?' done':'')+shadeCls+'">' +
          '<input type="checkbox" '+(node.done?'checked':'')+' onchange="toggleDone(\''+node.id+'\')">' +
          '<span>'+esc(node.text)+'</span>' +
        '</div>'
      // A dated item only ever appears here because it has an undated
      // descendant, so hasKids (and shadeCls) is always true in this branch.
      : '<div class="undated-label'+shadeCls+'">'+esc(node.text)+'</div>';
  } else {
    selfHtml = '<div class="undated-label undated-cat">'+esc(node.text)+'</div>';
  }
  var kidsHtml = kids.map(function(k){ return renderUndatedNode(k, depth+1); }).join('');
  return '<div class="undated-node">' + selfHtml + (kidsHtml ? '<div class="undated-children">'+kidsHtml+'</div>' : '') + '</div>';
}

function renderUndatedSection(){
  var cats = childrenOf(ROOT).filter(subtreeHasUndated);
  if(!cats.length) return '';
  return '<div class="undated-section"><h3>No date set</h3>' + cats.map(function(c){ return renderUndatedNode(c, 1); }).join('') + '</div>';
}

// ============================================================================
// NOTES
// A flat, unstructured place for things that don't fit a to-do item or a
// day-plan entry — a door code, a wifi password, anything just worth having
// on hand. Plain text, no fields, no dates: add, edit, delete.
//
// A note's text renders as a plain (non-editable) div with any link turned
// into a real <a>, not a contenteditable one — browsers generally treat a
// plain click on a link inside contenteditable as "place the cursor", not
// "follow it" (that's why Gmail/Docs need ctrl/cmd-click to open a link
// you're editing), and a touchscreen has no ctrl/cmd-click. So the one note
// being edited (_editingNoteId) swaps to a plain <input> instead of staying
// contenteditable; every other note stays tappable.
// ============================================================================
var _editingNoteId = null;

// Turns a recognized URL-shaped substring into a real link — operates on
// text already run through esc(), so anything that could break out of the
// href="..." attribute (a literal quote) has already become &quot;. Scripty
// schemes are left as plain text on purpose; they're never worth linking
// and a crafted one could otherwise run as a stored-XSS link, which matters
// here since anyone with the app's link can add a note.
function linkify(text){
  var escaped = esc(text);
  return escaped.replace(/([a-z][a-z0-9+.-]*:\/\/[^\s<]+|tel:[^\s<]+|mailto:[^\s<]+)/gi, function(url){
    if(/^(javascript|data|vbscript):/i.test(url)) return url;
    var trailing = '';
    var m = /[.,;:!?)"']+$/.exec(url);
    if(m){ trailing = m[0]; url = url.slice(0, -trailing.length); }
    var isWeb = /^https?:\/\//i.test(url);
    return '<a href="'+url+'"'+(isWeb ? ' target="_blank" rel="noopener noreferrer"' : '')+'>'+url+'</a>'+trailing;
  });
}

function startEditNote(id){
  _editingNoteId = id;
  renderNotes();
  var el = document.getElementById('note-edit-'+id);
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
// See saveEditPlace's comment — same Enter-then-reentrant-blur hazard: the
// element existing is not enough to rule out a stray second call, since the
// blur can fire synchronously mid-rebuild, before removal actually commits.
var _savingNoteId = null;
function saveEditNote(id){
  if(_savingNoteId === id) return;
  var el = document.getElementById('note-edit-'+id);
  if(!el) return; // already saved/closed — e.g. a stray blur after Enter already re-rendered
  _savingNoteId = id;
  var val = el.value;
  _editingNoteId = null;
  editNoteText(id, val);
  _savingNoteId = null;
}

// Same parentId-tree convention as the checklist (ROOT-parented top-level
// notes, any node can hold its own sub-notes, collapse/expand + depth
// shading reuse the exact same helpers and CSS) — just without a checkbox
// or owner/priority/due, and with the view/edit split a tappable link
// needs (see above).
var _notesCollapsed = {};
var _notesAddOpen = {};

function noteChildrenOf(parentId){
  return STATE.notes.filter(function(n){ return n.parentId===parentId; });
}
function toggleNoteCollapse(id){
  _notesCollapsed[id] = !_notesCollapsed[id];
  render();
}
function toggleNoteAddOpen(id){
  _notesAddOpen[id] = !_notesAddOpen[id];
  if(_notesAddOpen[id]) _notesCollapsed[id] = false;
  render();
  if(_notesAddOpen[id]){
    var el = document.getElementById('new-note-child-'+id);
    if(el) el.focus();
  }
}
function collapseAllNotes(){
  STATE.notes.forEach(function(n){ if(noteChildrenOf(n.id).length) _notesCollapsed[n.id] = true; });
  render();
}
function expandAllNotes(){
  _notesCollapsed = {};
  render();
}

function noteAddRowHtml(parentId, placeholder){
  return '<div class="add-row">' +
    '<input type="text" placeholder="'+esc(placeholder)+'" id="new-note-child-'+parentId+'" onkeydown="if(event.key===\'Enter\')addNoteChild(\''+parentId+'\')">' +
    '<button onclick="addNoteChild(\''+parentId+'\')">Add</button>' +
  '</div>';
}

function renderNoteNode(node, depth){
  depth = depth || 1;
  var kids = noteChildrenOf(node.id);
  var hasKids = kids.length>0;
  var isCollapsed = !!_notesCollapsed[node.id];
  var addOpen = !!_notesAddOpen[node.id];
  var isEditing = (_editingNoteId === node.id);
  var toggleBtn = hasKids
    ? '<button class="toggle" onclick="toggleNoteCollapse(\''+node.id+'\')" title="'+(isCollapsed?'Expand':'Collapse')+'">'+(isCollapsed?'▸':'▾')+'</button>'
    : '<span class="toggle-spacer"></span>';
  var body = isEditing
    ? '<input type="text" class="note-edit-input" id="note-edit-'+node.id+'" value="'+esc(node.text)+'" onkeydown="if(event.key===\'Enter\')saveEditNote(\''+node.id+'\')" onblur="saveEditNote(\''+node.id+'\')">'
    : '<div class="note-text">'+linkify(node.text)+(isCollapsed && hasKids ? ' <span class="kid-count">'+kids.length+' note'+(kids.length===1?'':'s')+'</span>' : '')+'</div>';
  var childrenHtml = isCollapsed ? '' :
    '<div class="node-children">' +
      kids.map(function(k){ return renderNoteNode(k, depth+1); }).join('') +
      (addOpen ? noteAddRowHtml(node.id, 'Add sub-note…') : '') +
    '</div>';
  return '' +
    '<div class="node" data-id="'+node.id+'">' +
      '<div class="item'+(hasKids?' '+groupShadeClass(depth):'')+'">' +
        toggleBtn +
        body +
        (isEditing ? '' : '<button class="plus" onclick="toggleNoteAddOpen(\''+node.id+'\')" title="Add sub-note">+</button>') +
        (isEditing ? '' : '<button class="plus" onclick="startEditNote(\''+node.id+'\')" title="Edit">✎</button>') +
        '<button class="del" onclick="deleteNoteItem(\''+node.id+'\')" title="Delete">✕</button>' +
      '</div>' +
      childrenHtml +
    '</div>';
}

function renderNotes(){
  var tops = noteChildrenOf(ROOT);
  var html = '<div class="checklist-toolbar">' +
    '<button class="toolbar-btn" onclick="expandAllNotes()">Expand all</button>' +
    '<button class="toolbar-btn" onclick="collapseAllNotes()">Collapse all</button>' +
  '</div>';
  if(!tops.length) html += '<div class="empty-day">Nothing saved yet — add your first note below.</div>';
  html += tops.map(function(n){ return renderNoteNode(n, 1); }).join('');
  html += noteAddRowHtml(ROOT, 'Add a note (door code, wifi password, etc.)…');
  document.getElementById('view-notes').innerHTML = html;
}

// ============================================================================
// PLACES
// Its own tab/page. Places are grouped by trip day (one button per day,
// matching the Trip Days dates, plus a "No day" bucket) rather than nested
// in a tree — a pin doesn't have sub-pins, so a day is the one level of
// grouping that actually matches how this gets used ("what's near me on the
// 17th?"). Only the selected day's pins show on the map and in the list;
// adding a place always files it under whichever day is currently selected.
//
// Input is deliberately a single field that accepts either shape:
//   - Paste a Google Maps link -> if it carries coordinates (most full
//     "https://www.google.com/maps/place/.../@lat,lng,..." links, and any
//     "q=lat,lng" link), the pin goes straight on the map and the original
//     link is kept as the "Open in Google Maps" deep link. A shortened link
//     (maps.app.goo.gl/...) has no coordinates in the URL text itself (it
//     only resolves them after a server redirect this page can't follow),
//     so it's still saved and still opens correctly, just without a pin.
//   - Type a place name or address -> saved immediately with a Google Maps
//     search link built from that text (works as a deep link regardless of
//     whether geocoding below succeeds), then geocoded in the background via
//     Nominatim (OpenStreetMap's free, no-API-key geocoder) to get a pin.
// Either way, nothing about adding a place ever blocks on the network call.
// ============================================================================
var _placesMap = null;
var _placesMarkersLayer = null;
var _editingPlaceId = null;
var PLACES_NO_DAY = "";
var PLACES_ALL_DAYS = "all";
var _editingPlaceDetailsId = null;
var _selectedPlacesDate = null;
var _selectedCategory = "personal";
var _selectedPtype = ""; // "" = all types
var _colorMode = "tier"; // "tier" (by preference) or "time" (by time of day)
var TIERS = [{key:"notRated", label:"○ Not rated"}, {key:"love", label:"❤️ Love it"}, {key:"pass", label:"🤷 Or not"}];
var PLACE_TYPES = [
  {key:"restaurant", label:"🍽️ Restaurant"},
  {key:"cafeTea", label:"☕ Café, tea & sweets"},
  {key:"barNightlife", label:"🍸 Bar & nightlife"},
  {key:"vineyard", label:"🍇 Vineyard"},
  {key:"parkGarden", label:"🌳 Park & garden"},
  {key:"beachViewpoint", label:"🌅 Beach & viewpoint"},
  {key:"landmarkMuseum", label:"🏛️ Landmark & museum"},
  {key:"tourActivity", label:"🎟️ Tour & activity"},
  {key:"shopping", label:"🛍️ Shopping"},
  {key:"site", label:"📍 Site & district"},
  {key:"logistics", label:"🧳 Transport / logistics"},
  {key:"conferenceSession", label:"🎤 Conference Session"},
  {key:"touristTrap", label:"🎡 Tourist Trap"}
];

// The current day + category + type selection together decide what's
// visible — and, symmetrically, what a newly-added place gets filed under
// (see addPlace), so there's never a separate "which day/category" picker
// in the add form itself. Type is the one exception: it's left untagged on
// add (so quick-adding never stalls on a fourth choice) and set afterward
// from the card's own dropdown.
function placesForView(){
  return STATE.places.filter(function(p){
    return (_selectedPlacesDate === PLACES_ALL_DAYS || (p.date||PLACES_NO_DAY) === _selectedPlacesDate) &&
           (p.category||"personal") === _selectedCategory &&
           (_selectedPtype === "" || (p.ptype||"") === _selectedPtype);
  });
}
function selectPtype(val){
  _selectedPtype = val;
  renderPlacesPage();
}
function shortDayLabel(dateStr){
  var d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'short', month:'numeric', day:'numeric'});
}
function selectPlacesDate(dateStr){

  renderPlacesPage();
}
function selectCategory(cat){

}
function selectColorMode(mode){

}

// Buckets a "H:MM AM/PM" string (same shape Trip Days uses) into a rough
// part of the day — drives either the pin's color (color-mode "time") or
// just its glyph (color-mode "tier", where color is already spent on
// love/pass). No time set buckets to "none" (a plain pin, no glyph).
function timeOfDayBucket(timeStr){
  var pt = parseSimpleTime(timeStr);
  if(!pt || pt.h === "--") return "none";
  var h24 = (parseInt(pt.h,10) % 12) + (pt.ap === "PM" ? 12 : 0);
  if(h24 < 11) return "morning";
  if(h24 < 17) return "afternoon";
  if(h24 < 21) return "evening";
  return "night";
}
function timeOfDayEmoji(bucket){
  return {morning:"🌅", afternoon:"☀️", evening:"🌇", night:"🌙", none:"📍"}[bucket];
}
function placeColor(p){
  if(_colorMode === "tier") return p.tier === "notRated" ? "var(--not-rated)" : ((p.tier === "love") ? "var(--love)" : "var(--pass)");
  var bucket = timeOfDayBucket(p.time);
  return {morning:"var(--tod-morning)", afternoon:"var(--tod-afternoon)", evening:"var(--tod-evening)", night:"var(--tod-night)", none:"var(--tod-none)"}[bucket];
}

function looksLikeMapsLink(text){
  return /^https?:\/\//i.test(text);
}

function extractLatLngFromMapsUrl(text){
  var m = /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(text);
  if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
  m = /[?&](?:q|query|destination)=(-?\d+\.\d+),(-?\d+\.\d+)/.exec(text);
  if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
  m = /^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/.exec(text);
  if(m) return {lat:parseFloat(m[1]), lng:parseFloat(m[2])};
  return null;
}
function extractNameFromMapsUrl(text){
  var m = /\/maps\/place\/([^\/@]+)/.exec(text);
  if(!m) return null;
  try{ return decodeURIComponent(m[1]).replace(/\+/g,' '); }catch(e){ return m[1].replace(/\+/g,' '); }
}
function buildMapsSearchUrl(query){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}
function geocodePlace(query){
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
  return fetch(url).then(function(r){ return r.ok ? r.json() : []; })
    .then(function(results){
      if(results && results.length) return {lat:parseFloat(results[0].lat), lng:parseFloat(results[0].lon)};
      return null;
    }).catch(function(){ return null; });
}

// A single exact query often comes back empty even though Nominatim knows
// the street — OpenStreetMap's US address-point coverage is spotty at the
// exact-house-number level, and mashing a venue name together with its full
// street address (e.g. "East Cobb Pediatrics, 6110 Pine Mountain Rd, Kennesaw,
// GA 30152", copied straight off a contact card) trips up its free-form
// parser even when each piece alone would work. So on a miss, retry with
// broader versions of the same text — dropping a leading venue name (after
// the first comma) and/or a leading house number — landing an approximate
// but still useful pin (same street/area) rather than none at all.
function buildGeocodeAttempts(query){
  var candidates = [query];
  var commaIdx = query.indexOf(',');
  if(commaIdx !== -1) candidates.push(query.slice(commaIdx+1).trim());
  candidates.slice().forEach(function(c){
    var stripped = c.replace(/^\s*\d+[\s,]*/, '');
    if(stripped && candidates.indexOf(stripped) === -1) candidates.push(stripped);
  });
  var seen = {};
  return candidates.filter(function(c){
    if(!c || seen[c]) return false;
    seen[c] = true;
    return true;
  });
}
function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
function geocodeWithFallback(query){
  var attempts = buildGeocodeAttempts(query);
  function tryNext(i){
    if(i >= attempts.length) return Promise.resolve(null);
    // Nominatim's usage policy asks for no more than ~1 request/second —
    // the common case (first attempt hits) never pays this, only a retry.
    var step = (i === 0) ? geocodePlace(attempts[i]) : wait(1100).then(function(){ return geocodePlace(attempts[i]); });
    return step.then(function(found){ return found || tryNext(i+1); });
  }
  return tryNext(0);
}

function addPlace(){
  var input = document.getElementById('new-place');
  var raw = (input.value||'').trim();
  if(!raw) return;
  input.value = '';

  var isLink = looksLikeMapsLink(raw);
  var coords = extractLatLngFromMapsUrl(raw);
  var place = {
    id: uid('pl'),
    label: isLink ? (extractNameFromMapsUrl(raw) || 'New place') : raw,
    mapsUrl: isLink ? raw : buildMapsSearchUrl(raw),
    lat: coords ? coords.lat : null,
    lng: coords ? coords.lng : null,
    date: _selectedPlacesDate === PLACES_ALL_DAYS ? PLACES_NO_DAY : (_selectedPlacesDate || PLACES_NO_DAY),
    category: _selectedCategory,
    tier: "notRated",
    time: "",
    ptype: "",
    address: "",
    notes: "",
    references: []
  };
  STATE.places.push(place);
  persist();

  if(!isLink && !coords){
    geocodeWithFallback(raw).then(function(found){
      if(!found) return;
      var p = STATE.places.find(function(x){ return x.id===place.id; });
      if(!p || p.address || p.label !== place.label) return;
      p.lat = found.lat; p.lng = found.lng;
      persist();
    });
  }
}
function deletePlace(id){
  STATE.places = STATE.places.filter(function(p){ return p.id!==id; });
  persist();
}
function movePlaceDay(id, newDate){
  var p = STATE.places.find(function(x){ return x.id===id; });
  if(!p) return;
  p.date = newDate;
  persist();
}
function setPlaceTier(id, tier){
  var p = STATE.places.find(function(x){ return x.id===id; });
  if(!p) return;
  p.tier = tier;
  persist();
}
function setPlaceType(id, ptype){
  var p = STATE.places.find(function(x){ return x.id===id; });
  if(!p) return;
  p.ptype = ptype;
  persist();
}
function editPlaceTime(id, which, value){
  var p = STATE.places.find(function(x){ return x.id===id; });
  if(!p) return;
  var pt = parseSimpleTime(p.time) || {h:"--", m:"00", ap:"AM"};
  pt[which] = value;
  p.time = (pt.h==="--") ? "" : (pt.h+":"+pt.m+" "+pt.ap);
  persist();
}

// Drag-to-tier, via Pointer Events (not the HTML5 Drag and Drop API, which
// touch Safari doesn't reliably support) — the row translates with the
// finger/cursor and whichever tier section is under the pointer highlights
// as the drop target; releasing over one sets that tier. The dropdown on
// each row does the exact same thing (setPlaceTier) — this is just a second
// way in, for sorting a pile of places at a glance rather than one at a time.
var _dragPlaceId = null, _dragStartY = 0, _dragEl = null;
function tierDragStart(e, id){
  e.preventDefault();
  var row = e.currentTarget.closest('.place-row');
  if(!row) return;
  _dragPlaceId = id;
  _dragEl = row;
  _dragStartY = e.clientY;
  row.classList.add('dragging');
  // Without this, elementFromPoint below would keep finding the dragged
  // row itself once its translateY carries it over a tier section — it's
  // still the top-painted thing at that pixel — instead of the section
  // underneath, so it could never detect anything but its own starting tier.
  row.style.pointerEvents = 'none';
  document.addEventListener('pointermove', tierDragMove);
  document.addEventListener('pointerup', tierDragEnd);
}
function tierDragMove(e){
  if(!_dragEl) return;
  _dragEl.style.transform = 'translateY('+(e.clientY - _dragStartY)+'px)';
  var over = document.elementFromPoint(e.clientX, e.clientY);
  var sec = over && over.closest('.tier-section');
  document.querySelectorAll('.tier-section').forEach(function(s){ s.classList.toggle('drop-target', s===sec); });
}
function tierDragEnd(e){
  document.removeEventListener('pointermove', tierDragMove);
  document.removeEventListener('pointerup', tierDragEnd);
  var over = document.elementFromPoint(e.clientX, e.clientY);
  var sec = over && over.closest('.tier-section');
  document.querySelectorAll('.tier-section').forEach(function(s){ s.classList.remove('drop-target'); });
  if(_dragEl){ _dragEl.style.transform = ''; _dragEl.style.pointerEvents = ''; _dragEl.classList.remove('dragging'); }
  if(sec && _dragPlaceId) setPlaceTier(_dragPlaceId, sec.dataset.tier);
  _dragPlaceId = null; _dragEl = null;
}
function startEditPlace(id){
  _editingPlaceId = id;
  renderPlacesList();
  var el = document.getElementById('place-edit-'+id);
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}
// Saving (Enter, then blur) can re-enter this mid-rebuild: replacing the
// edit <input> via innerHTML while it still has focus makes the browser
// fire a 'blur' on it as part of that very removal, synchronously, before
// the element is actually gone — so a plain "does the element still exist"
// check doesn't catch it (it still does, for an instant) and a second
// render() starts while the first is still inside its own innerHTML
// assignment, which throws. This flag blocks the second call outright,
// before it can touch the DOM at all.
var _savingPlaceId = null;
function saveEditPlace(id){
  if(_savingPlaceId === id) return;
  var el = document.getElementById('place-edit-'+id);
  if(!el) return;
  _savingPlaceId = id;
  var val = el.value;
  _editingPlaceId = null;
  var p = STATE.places.find(function(x){ return x.id===id; });
  if(!p){ _savingPlaceId = null; renderPlacesList(); return; }
  p.label = val;
  persist();
  _savingPlaceId = null;
  // A pin-less place (a shortened Google Maps link with no coordinates in
  // the URL, or an address that failed to geocode) gets one more shot the
  // moment it's renamed — most often to the actual place name/address once
  // the user has it in front of them, which is exactly what geocoding needs.
  if(p.lat == null){
    var query = p.address || val;
    geocodeWithFallback(query).then(function(found){
      if(!found) return;
      var p2 = STATE.places.find(function(x){ return x.id===id; });
      if(!p2 || (p2.address || p2.label) !== query) return;
      p2.lat = found.lat; p2.lng = found.lng;
      persist();
    });
  }
}

// Builds the Places page's fixed skeleton (day bar + map div + list div +

// Single-select, not multi — functionally a radio group ("all, or exactly
// one type"), just built as a plain <select> to match every other picker
// in this app (owner, priority, tier, day…) rather than a one-off custom
// radio-button popover.
function renderPlacesPtypeBar(){
  var options = '<option value=""'+(_selectedPtype===""?' selected':'')+'>All types</option>' +
    PLACE_TYPES.map(function(t){ return '<option value="'+t.key+'"'+(t.key===_selectedPtype?' selected':'')+'>'+t.label+'</option>'; }).join('');

    if(typeof p.lat !== 'number' || typeof p.lng !== 'number') return;

// Flights & Stays uses shared trip storage as explicitly authorized.
// The former browser-only store is retained as a migration backup.
// No booking identifiers are seeded in source code.
var RESERVATIONS_KEY = "ignite-private-reservations-v1";
var RESERVATIONS_VERSION = 1;
var _reservationDate = "all";
var _reservationEditingId = null;
var _reservationImportPreview = null;
var _reservationStorageError = "";
var RESERVATIONS = STATE.reservations;
var _legacyLocalReservations = loadReservations();

function reservationText(v){return typeof v === "string" ? v : (typeof v === "number" ? String(v) : "");}
function normalizeReservation(r){
  if(!r || !["flight","hotel"].includes(r.kind)) throw new Error("Each reservation must be a flight or hotel.");
  var out={id:typeof r.id==="string"&&/^[a-zA-Z0-9_-]+$/.test(r.id)?r.id:uid("rs"),kind:r.kind};
  ["title","provider","number","from","to","address","phone","room","reference","agencyReference","paid","due","total","currency","cancellation","notes"].forEach(function(k){out[k]=reservationText(r[k]);});
  ["start","end"].forEach(function(k){
    var x=r[k]||{};out[k]={date:reservationText(x.date),time:reservationText(x.time),zone:reservationText(x.zone)};
    if(out[k].date && (!/^\d{4}-\d{2}-\d{2}$/.test(out[k].date)||(isNaN(Date.parse(out[k].date+"T12:00:00Z"))||new Date(out[k].date+"T12:00:00Z").toISOString().slice(0,10)!==out[k].date)))throw new Error("Use a valid reservation date.");
    if(out[k].time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(out[k].time))throw new Error("Use a time in HH:MM format.");
    if(out[k].zone){try{new Intl.DateTimeFormat("en",{timeZone:out[k].zone});}catch(e){throw new Error("Unknown timezone.");}}
  });
  if(!out.title.trim())throw new Error("A reservation needs a title.");
  if(out.start.date&&out.end.date&&out.end.date<out.start.date)throw new Error("The end date cannot be before the start date.");
  out.travellers=(Array.isArray(r.travellers)?r.travellers:[]).map(function(t){
    var x={};["name","seat","confirmation","ticket","fare","baggage","cost"].forEach(function(k){x[k]=reservationText(t[k]);});return x;
  }).filter(function(t){return t.name.trim();});
  out.links=(Array.isArray(r.links)?r.links:[]).map(function(l){return {label:reservationText(l.label)||"Reference",url:safeReferenceUrl(l.url)};}).filter(function(l){return l.url;});
  out.sourceNames=(Array.isArray(r.sourceNames)?r.sourceNames:[]).map(reservationText).filter(Boolean);
  return out;
}
function migrateReservations(list){
  return (Array.isArray(list) ? list : []).map(normalizeReservation);
}
function legacyReservationsToSync(){
  return _legacyLocalReservations.filter(function(r){return !RESERVATIONS.some(function(x){return x.id===r.id||reservationIdentity(x)===reservationIdentity(r);});});
}
function syncLegacyReservations(){
  var pending=legacyReservationsToSync();
  if(pending.length) persist("reservations",mergeReservationImports(RESERVATIONS,pending));
}
function loadReservations(){
  try{
    var raw=localStorage.getItem(RESERVATIONS_KEY);
    if(!raw)return [];
    var data=JSON.parse(raw);
    if(data.version!==RESERVATIONS_VERSION)throw new Error("Reservation storage is from a different version. Keep a backup before continuing.");
    if(!Array.isArray(data.records))throw new Error("Reservation storage could not be read.");
    return data.records.map(normalizeReservation);
  }catch(e){_reservationStorageError=e.message;return [];}
}
function reservationDay(date){
  return date?new Date(date+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"}):"Date not supplied";
}
function reservationTime(part){
  if(!part.time)return "Time not supplied";
  var h=+part.time.slice(0,2),m=part.time.slice(3);
  var text=(h%12||12)+":"+m+" "+(h>=12?"PM":"AM");
  if(part.zone){
    var z=new Intl.DateTimeFormat("en-US",{timeZone:part.zone,timeZoneName:"short"}).formatToParts(new Date((part.date||"2026-11-16")+"T12:00:00Z")).find(function(x){return x.type==="timeZoneName";});
    text+=" "+z.value;
  }else text+=" (timezone not supplied)";
  return text;
}
function reservationBucket(time){
  if(!time)return "none";var h=+time.slice(0,2);
  return h<11?"morning":h<17?"afternoon":h<21?"evening":"night";
}
function reservationIdentity(r){
  return [r.kind,r.kind==="flight"?r.provider+"|"+r.number+"|"+r.from+"|"+r.to:r.title+"|"+r.address,r.start.date,r.kind==="hotel"?r.end.date:""].join("|").toLowerCase().replace(/\s+/g," ").trim();
}
function mergeReservationImports(current,incoming){
  var result=current.slice();
  incoming.forEach(function(r){
    var i=result.findIndex(function(x){return x.id===r.id||reservationIdentity(x)===reservationIdentity(r);});
    if(i<0){result.push(r);return;}
    var old=result[i],next=Object.assign({},old);
    Object.keys(r).forEach(function(k){if(typeof r[k]==="string"&&r[k])next[k]=r[k];});
    next.id=old.id;
    ["start","end"].forEach(function(k){next[k]=Object.assign({},old[k]);Object.keys(r[k]).forEach(function(f){if(r[k][f])next[k][f]=r[k][f];});});
    next.travellers=old.travellers.slice();
    r.travellers.forEach(function(t){
      var j=next.travellers.findIndex(function(x){return x.name.trim().toLowerCase()===t.name.trim().toLowerCase();});
      if(j<0)next.travellers.push(t);
      else{var updated=Object.assign({},next.travellers[j]);Object.keys(t).forEach(function(k){if(t[k])updated[k]=t[k];});next.travellers[j]=updated;}
    });
    next.links=old.links.concat(r.links).filter(function(l,j,a){return a.findIndex(function(x){return x.url===l.url;})===j;});
    next.sourceNames=Array.from(new Set(old.sourceNames.concat(r.sourceNames)));result[i]=next;
  });
  return result;
}
function commitReservations(next){
  if(_staleBlocked){reservationMessage("Reload the app before saving this reservation.");return false;}
  try{
    STATE.reservations=migrateReservations(next);
    RESERVATIONS=STATE.reservations;_reservationEditingId=null;_reservationImportPreview=null;
    persist();renderReservations(true);return true;
  }catch(e){reservationMessage("Could not save reservation: "+e.message);return false;}
}

}

function renderReservations(force){

    '<p class="reservation-muted">Times are local to each airport or hotel. Gold: morning · Blue: afternoon · Coral: evening · Purple: night. Dates and timezone labels remain visible.</p>'+
    '<p><button onclick="newReservation(\'flight\')">Add flight</button> <button onclick="newReservation(\'hotel\')">Add hotel stay</button></p>'+
    '<div id="reservationEditor"></div><div class="reservation-count">'+list.length+' reservation'+(list.length===1?"":"s")+'</div>'+
    list.map(renderReservationCard).join("")+

    '<textarea id="reservationImportText" aria-label="Reservation import JSON" rows="7"></textarea><p><button onclick="previewReservationImport()">Preview import</button></p><div id="reservationImportPreview"></div></details></section>';
}
function selectReservationDate(date){_reservationDate=date;renderReservations(true);}
function reservationInput(name,label,value,type){
  return '<label>'+esc(label)+'<input name="'+name+'" type="'+(type||"text")+'" value="'+esc(value||"")+'"></label>';
}
function reservationZoneInput(name,value){
