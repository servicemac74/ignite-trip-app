function newReservation(kind){editReservation(null,kind);}
function editReservation(id,kind){
  var r=id?RESERVATIONS.find(function(x){return x.id===id;}):normalizeReservation({kind:kind,title:kind==="flight"?"New flight":"New hotel stay",start:{},end:{},travellers:[]});
  if(!r)return;_reservationEditingId=r.id;renderReservations(true);
  var fields='<form id="reservationEditForm" class="reservation-form" data-kind="'+r.kind+'" onsubmit="event.preventDefault();saveReservationForm()">'+
    '<h3>'+ (id?"Edit":"Add")+' '+(r.kind==="flight"?"flight":"hotel stay")+'</h3>'+
    reservationInput("title","Title",r.title)+reservationInput("provider","Airline / booking provider",r.provider);
  if(r.kind==="flight")fields+=reservationInput("number","Flight number",r.number)+reservationInput("from","Departure airport",r.from)+reservationInput("to","Arrival airport",r.to);
  else fields+=reservationInput("address","Hotel address",r.address)+reservationInput("phone","Hotel phone",r.phone)+reservationInput("room","Room",r.room)+reservationInput("reference","Hotel confirmation",r.reference)+reservationInput("agencyReference","Agency trip number",r.agencyReference);
  ["start","end"].forEach(function(k){fields+='<fieldset><legend>'+(k==="start"?(r.kind==="flight"?"Departure":"Check-in"):(r.kind==="flight"?"Arrival":"Check-out"))+'</legend>'+reservationInput(k+"Date","Date",r[k].date,"date")+reservationInput(k+"Time","Local time",r[k].time,"time")+reservationZoneInput(k+"Zone",r[k].zone)+'</fieldset>';});
  if(r.kind==="hotel")fields+=reservationInput("paid","Already paid",r.paid)+reservationInput("due","Due at property",r.due)+reservationInput("total","Total cost",r.total)+reservationInput("cancellation","Cancellation terms / deadline and timezone",r.cancellation);
  var travelers=r.travellers.length?r.travellers:[{name:""},{name:""}];
  fields+='<p>Travelers are grouped inside this reservation; separate booking codes and seats are retained.</p><div id="reservationTravelerFields">'+travelers.map(renderReservationTravelerForm).join("")+'</div><button type="button" onclick="addReservationTraveler()">Add traveler</button>'+
    reservationInput("currency","Currency",r.currency||"USD")+
    '<label>Notes<textarea name="notes" rows="5">'+esc(r.notes)+'</textarea></label>'+
    '<label>Links — one label and URL per line, separated by |<textarea name="links" rows="3">'+esc(r.links.map(function(l){return l.label+" | "+l.url;}).join("\n"))+'</textarea></label>'+
    '<label>Source filenames — one per line<textarea name="sourceNames" rows="3">'+esc(r.sourceNames.join("\n"))+'</textarea></label>'+
    '<p><button type="submit">Save reservation</button> <button type="button" onclick="_reservationEditingId=null;renderReservations(true)">Cancel</button></p></form>';
  document.getElementById("reservationEditor").innerHTML=fields;
  document.getElementById("reservationEditor").scrollIntoView({block:"start"});
}
function renderReservationTravelerForm(t){
  return '<fieldset class="reservation-traveler-fields"><legend>Traveler</legend>'+
    ["name","seat","confirmation","ticket","fare","baggage","cost"].map(function(k){return reservationInput(k,{name:"Traveler name",seat:"Seat / assignment status",confirmation:"Traveler confirmation",ticket:"Ticket number",fare:"Fare / bundle",baggage:"Baggage included or listed",cost:"Receipt total"}[k],t[k]);}).join("")+'</fieldset>';
}
function addReservationTraveler(){document.getElementById("reservationTravelerFields").insertAdjacentHTML("beforeend",renderReservationTravelerForm({}));}
function saveReservationForm(){
  var form=document.getElementById("reservationEditForm");if(!form)return;
  function val(k){var el=form.elements.namedItem(k);return el&&typeof el.value==="string"?el.value.trim():"";}
  var r={id:_reservationEditingId,kind:form.getAttribute("data-kind")};
  ["title","provider","number","from","to","address","phone","room","reference","agencyReference","paid","due","total","currency","cancellation","notes"].forEach(function(k){r[k]=val(k);});
  ["start","end"].forEach(function(k){r[k]={date:val(k+"Date"),time:val(k+"Time"),zone:val(k+"Zone")};});
  r.travellers=Array.from(form.querySelectorAll(".reservation-traveler-fields")).map(function(group){var t={};["name","seat","confirmation","ticket","fare","baggage","cost"].forEach(function(k){t[k]=group.querySelector('[name="'+k+'"]').value.trim();});return t;});
  var invalid=false;r.links=val("links").split("\n").filter(function(x){return x.trim();}).map(function(line){var parts=line.split("|"),url=parts.pop().trim();if(!safeReferenceUrl(url))invalid=true;return {label:parts.join("|").trim()||"Reference",url:url};});
  if(invalid){reservationMessage("Every link needs a complete HTTP(S) URL.");return;}
  r.sourceNames=val("sourceNames").split("\n").filter(Boolean);
  try{
    r=normalizeReservation(r);
    var next=RESERVATIONS.slice(),i=next.findIndex(function(x){return x.id===r.id;});
    if(i<0)next.push(r);else next[i]=r;
    persist("reservations",next);
  }catch(e){reservationMessage(e.message);}
}
function previewReservationImport(){
  try{
    _reservationImportPreview=null;
    var parsed=JSON.parse(document.getElementById("reservationImportText").value);
    if(parsed.version!==RESERVATIONS_VERSION||!Array.isArray(parsed.records))throw new Error("Expected reservation JSON with version 1 and a records array.");
    var rows=parsed.records.map(normalizeReservation);if(!rows.length)throw new Error("There are no reservations to import.");
    _reservationImportPreview=rows;
    document.getElementById("reservationImportPreview").innerHTML='<p>'+rows.length+' reservation(s) ready. '+mergeReservationImports(RESERVATIONS,rows).length+' total after merging.</p><ul>'+rows.map(function(r){return '<li>'+esc(r.title)+' — '+esc(reservationDay(r.start.date))+'</li>';}).join("")+'</ul><button onclick="applyReservationImport()">Save imported reservations</button>';
  }catch(e){document.getElementById("reservationImportPreview").textContent=e.message;}
}
function applyReservationImport(){if(_reservationImportPreview)persist("reservations",mergeReservationImports(RESERVATIONS,_reservationImportPreview));}
window.addEventListener("storage",function(e){if(e.key===RESERVATIONS_KEY){_legacyLocalReservations=loadReservations();renderReservations();}});


function render(){ RESERVATIONS=STATE.reservations || []; renderChecklist(); renderDays(); renderCalendar(); renderNotes(); renderPlacesPage(); renderReservations(); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// A node with no children stays plain white — only nodes acting as a group
// (subtask holding its own sub-steps, like "Kitchen" holding "Counters")
// get tinted, progressively lighter the deeper the grouping goes, so a
// glance tells subtask from sub-subtask instead of everything blending
// into one white block. Caps at 3 shades; deeper nesting reuses the
// lightest one rather than fading to nothing.
var GROUP_SHADE_LEVELS = 3;
function groupShadeClass(depth){ return 'has-kids-'+Math.min(depth, GROUP_SHADE_LEVELS); }

// A plain location.reload() can still be served a cached copy of this page
// (that's the whole reason the update-check/stale-block banners exist in
// the first place) — a cache-busting query string forces a real network
// fetch instead.
function hardReload(){ location.href = location.pathname + '?v=' + Date.now(); }

var _staleBlocked = false;
function showStaleBlock(){
  if(_staleBlocked) return;
  _staleBlocked = true;
  var o = document.createElement('div');
  o.id = 'staleBlock';
  o.className = 'stale-block';
  o.innerHTML = '<div class="stale-block-card">' +
    'This app is out of date — someone else has already saved a newer version. ' +
    'Reload to keep editing safely (nothing you\'ve already saved will be lost).' +
    '<br><button onclick="hardReload()">Reload</button>' +
    '</div>';
  document.body.appendChild(o);
}

// ============================================================================
// MUTATIONS — every mutation calls persist()
// ============================================================================

function persist(scope, records){
  if(scope === "reservations") return commitReservations(records);
  saveLocal();
  render();
  if(typeof FB !== "undefined") FB.scheduleWrite();
}

function toggleDone(id){
  var i = STATE.checklist.find(function(x){ return x.id===id; });
  if(!i) return;
  i.done = !i.done;
  persist();
}
function editChecklistField(id, field, value){
  var i = STATE.checklist.find(function(x){ return x.id===id; });
  if(!i) return;
  i[field] = value;
  persist();
}
// Deletes a node and everything nested under it (a section's items, a
// task's sub-steps, however many levels deep) — otherwise deleting a parent
// would leave its children orphaned with a parentId pointing at nothing.
function deleteNode(id){
  var toDelete = [id];
  for(var i=0; i<toDelete.length; i++){
    var pid = toDelete[i];
    STATE.checklist.forEach(function(n){ if(n.parentId===pid) toDelete.push(n.id); });
  }
  STATE.checklist = STATE.checklist.filter(function(n){ return toDelete.indexOf(n.id)===-1; });
  persist();
}
function addChild(parentId){
  var input = document.getElementById('new-child-'+parentId);
  var text = (input.value||'').trim();
  if(!text) return;
  STATE.checklist.push({id:uid("ck"), parentId:parentId, text:text, owner:"Chris/Inez", priority:"Medium", due:"", done:false});
  input.value='';
  persist();
}
function addCategory(){
  var input = document.getElementById('new-category');
  var text = (input.value||'').trim();
  if(!text) return;
  STATE.checklist.push({id:uid("ck"), parentId:ROOT, text:text});
  input.value='';
  persist();
}

function editEntryField(date, id, field, value){
  var d = STATE.days.find(function(x){ return x.date===date; });
  if(!d) return;
  var e = d.entries.find(function(x){ return x.id===id; });
  if(!e) return;
  e[field] = value;

}
function editEntryTime(date, id, which, value){
  var d = STATE.days.find(function(x){ return x.date===date; });
  if(!d) return;
  var e = d.entries.find(function(x){ return x.id===id; });
  if(!e) return;
  var pt = parseSimpleTime(e.time) || {h:"--", m:"00", ap:"AM"};
  pt[which] = value;
  e.time = (pt.h==="--") ? "" : (pt.h+":"+pt.m+" "+pt.ap);
  persist();
}
function deleteEntry(date, id){
  var d = STATE.days.find(function(x){ return x.date===date; });
  if(!d) return;
  d.entries = d.entries.filter(function(x){ return x.id!==id; });
  persist();
}
function addEntry(date){
  var d = STATE.days.find(function(x){ return x.date===date; });
  if(!d) return;
  var hEl = document.getElementById('newtime-h-'+date);
  var mEl = document.getElementById('newtime-m-'+date);
  var apEl = document.getElementById('newtime-ap-'+date);
  var titleEl = document.getElementById('newtitle-'+date);
  var title = (titleEl.value||'').trim();
  if(!title) return;
  var time = (hEl.value==='--') ? '' : (hEl.value+':'+mEl.value+' '+apEl.value);
  d.entries.push({id:uid("en"), time:time, title:title, owner:"Both", notes:""});
  hEl.value='--'; mEl.value='00'; apEl.value='AM'; titleEl.value='';
  persist();
}

function setTab(which){
  ['checklist','days','cal','notes','places','reservations'].forEach(function(w){

// ============================================================================
// FIREBASE SYNC MODULE
// Uses its own dedicated Firebase project, "ignite-trip-app" (separated
// 2026-11-08 from the shared mcdonald-dashboard-01 project so this ephemeral
// trip app's sync layer can never touch the MCD/Redhelm Dashboard's data).
// Path: sessions/ignite-trip (single node, whole STATE stored as the value,
// same debounce + echo-loop-guard pattern as the Dashboard app's FB module).
// ============================================================================
var FB = (function(){
  var _config = {
    apiKey:            "AIzaSyAbz9G0_I4nHRzMkHvUqoqhjRQY83xxlDc",
    authDomain:        "ignite-trip-app.firebaseapp.com",
    projectId:         "ignite-trip-app",
    storageBucket:     "ignite-trip-app.firebasestorage.app",
    messagingSenderId: "60434395983",
    appId:             "1:60434395983:web:67a6517333ec33b69bcb3a",
    databaseURL:       "https://ignite-trip-app-default-rtdb.firebaseio.com"
  };

  var _db=null, _ref=null, _writeTimer=null, _lastSavedAt=null, _initialized=false, _listenerOn=false;

  function _setStatus(state,label){
    var b=document.getElementById('syncBadge'), l=document.getElementById('syncLabel');
    if(b) b.setAttribute('data-state', state);
    if(l) l.textContent = label || state;
  }

  function _fbArr(val){
    if(!val) return [];
    if(Array.isArray(val)) return val;
    if(typeof val === 'object'){
      var keys = Object.keys(val);
      if(keys.length>0 && keys.every(function(k){return /^\d+$/.test(k);})){
        return keys.sort(function(a,b){return +a-+b;}).map(function(k){return val[k];});
      }
    }
    return [];
  }
  function _normalize(data){
    var checklist = migrateChecklist(_fbArr(data.checklist));
    var days = _fbArr(data.days).map(function(d){ d.entries = _fbArr(d.entries); return d; });
    var notes = migrateNotes(_fbArr(data.notes));
    var places = migratePlaces(_fbArr(data.places).map(function(p){ return Object.assign({}, p, {references:_fbArr(p.references)}); }));
    var reservations = migrateReservations(_fbArr(data.reservations).map(function(r){
      return Object.assign({},r,{travellers:_fbArr(r.travellers),links:_fbArr(r.links),sourceNames:_fbArr(r.sourceNames)});
    }));
    return {checklist:checklist, days:days, notes:notes, places:places, reservations:reservations};
  }

  function _buildPayload(){
    return {
      kind: "ignite-trip-planner",
      version: SCHEMA_VERSION,
      savedAt: new Date().toISOString(),
      checklist: STATE.checklist,
      days: STATE.days,
      notes: STATE.notes,
      places: STATE.places,
      reservations: STATE.reservations
    };
  }

  function _applyPayload(result){
    if(!result) return;
    var norm = _normalize(result);
    if(!norm.checklist.length && !norm.days.length && !norm.notes.length && !norm.places.length && !norm.reservations.length) return;
    STATE = {checklist:norm.checklist, days:norm.days, notes:norm.notes, places:norm.places, reservations:norm.reservations};
    saveLocal();
    render();
  }

  function _doWrite(){
    if(!_ref || _staleBlocked) return;
    _setStatus('syncing','syncing...');
    var payload = _buildPayload();
    _lastSavedAt = payload.savedAt;
    _ref.set(payload).then(function(){ _setStatus('synced','synced'); })
                      .catch(function(){ _setStatus('offline','offline'); });
  }
  function scheduleWrite(){
    if(!_initialized) return;
    clearTimeout(_writeTimer);
    _writeTimer = setTimeout(_doWrite, 300);
  }

  function init(){
    try{
      if(typeof firebase === 'undefined' || !firebase.app){ _setStatus('offline','offline'); return; }
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(_config);
      _db = firebase.database(app);
      _ref = _db.ref('sessions/ignite-trip');
      _initialized = true;
      _setStatus('syncing','loading...');

      _ref.once('value').then(function(snap){
        var data = snap.val();
        if(data && data.savedAt){
          _lastSavedAt = data.savedAt;
          if(typeof data.version === 'number' && data.version > SCHEMA_VERSION){
            // Someone else already saved with a newer build than this one
            // understands — don't touch it. Applying it with old rendering
            // code, or (worse) writing this client's own state back over
            // it, is exactly the clobber this check exists to prevent.
            showStaleBlock();
            _setStatus('offline','out of date');
          } else {
            _applyPayload(data);
            _setStatus('synced','synced');
          }
        } else {
          // nothing in Firebase yet — push our current (local/default) state as the seed
          _doWrite();
        }
        if(!_listenerOn){
          _listenerOn = true;
          _ref.on('value', function(snap2){
            var remote = snap2.val();
            if(!remote || !remote.savedAt) return;
            if(_lastSavedAt && remote.savedAt <= _lastSavedAt) return;
            _lastSavedAt = remote.savedAt;
            if(typeof remote.version === 'number' && remote.version > SCHEMA_VERSION){
              showStaleBlock();
              _setStatus('offline','out of date');
              return;
            }
            _setStatus('syncing','syncing...');
            _applyPayload(remote);
            _setStatus('synced','synced');
          });
        }
      }).catch(function(){ _setStatus('offline','offline'); });
    }catch(e){ _setStatus('offline','offline'); }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 100);
  }

  return { scheduleWrite: scheduleWrite };
})();

// ============================================================================
// UPDATE CHECK
// Phones that "Add to Home Screen" often keep this page suspended in memory
// and reuse it instead of refetching, so a new git push can sit unnoticed for
// days. This polls the page's own Last-Modified/ETag (via a no-store HEAD
// request — no service worker needed) and prompts a reload when it changes,
// both on a timer and whenever the app comes back to the foreground.
// ============================================================================
(function(){
  var CHECK_INTERVAL_MS = 5*60*1000;
  var _knownTag = null;

  function check(){
    fetch(location.pathname, {method:'HEAD', cache:'no-store'}).then(function(r){
      var tag = r.headers.get('etag') || r.headers.get('last-modified');
      if(!tag) return;
      if(_knownTag && tag !== _knownTag) showBanner();
      _knownTag = tag;
    }).catch(function(){});
  }

  function showBanner(){
    if(document.getElementById('updateBanner')) return;
    var b = document.createElement('div');
    b.id = 'updateBanner';
    b.className = 'update-banner';
    b.textContent = 'A new version is available — tap to reload';
    b.onclick = hardReload;
    document.body.appendChild(b);
  }

  check();
  setInterval(check, CHECK_INTERVAL_MS);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') check();
  });
  window.addEventListener('pageshow', check);
})();
</script>
